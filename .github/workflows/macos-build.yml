name: Build macOS App

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: Navia
  DERIVED_DATA_PATH: build/DerivedData
  RESULT_BUNDLE_PATH: build/NaviaBuild.xcresult
  RCT_NO_LAUNCH_PACKAGER: "1"
  SENTRY_DISABLE_AUTO_UPLOAD: "true"
  COMPILER_INDEX_STORE_ENABLE: "NO"

jobs:
  build-macos:
    name: Build signed Navia.app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Set up Ruby gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods dependencies
        working-directory: macos
        run: bundle exec pod install

      - name: Create CI environment module
        run: |
          cat > src/env.ts <<'EOF_ENV'
          export const SentryDSN = "";
          EOF_ENV

      - name: Check React Native bundle inputs
        run: |
          bunx react-native bundle \
            --entry-file index.js \
            --platform macos \
            --dev false \
            --bundle-output build/preflight-main.jsbundle \
            --assets-dest build/preflight-assets \
            --reset-cache

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Write App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/notary"
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary/AuthKey_$API_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/notary/AuthKey_$API_KEY_ID.p8"

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace macos/sol.xcworkspace \
            -scheme release

      - name: Build signed macOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild \
            -workspace macos/sol.xcworkspace \
            -scheme release \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            build

      - name: Verify code signature before notarization
        run: |
          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"
          codesign --verify --strict --deep --verbose=4 "$app_path"
          codesign -dv --verbose=4 "$app_path"

      - name: Package app for notarization
        run: |
          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"
          zip_path="build/$APP_NAME-notary.zip"

          test -d "$app_path"
          cd "$(dirname "$app_path")"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "$GITHUB_WORKSPACE/$zip_path"

      - name: Notarize app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun notarytool submit "build/$APP_NAME-notary.zip" \
            --key "$RUNNER_TEMP/notary/AuthKey_$API_KEY_ID.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait

      - name: Staple notarization ticket
        run: |
          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"

      - name: Package installable app artifact
        run: |
          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_NAME.app"
          zip_path="build/$APP_NAME.app.zip"

          rm -f "$zip_path"
          cd "$(dirname "$app_path")"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "$GITHUB_WORKSPACE/$zip_path"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navia-macOS-signed-notarized-app
          path: build/Navia.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Navia-xcresult
          path: build/NaviaBuild.xcresult
          if-no-files-found: ignore
          retention-days: 7
